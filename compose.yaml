services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    queue:
        # Reuses the image built by laravel.test, so it must never be pulled.
        image: 'sail-8.5/app'
        pull_policy: never
        # Longer than GradeSubmission::$timeout, shorter than the queue's retry_after.
        command: 'php artisan queue:listen --timeout=630'
        restart: unless-stopped
        environment:
            # Must match laravel.test to read uploaded PDFs. Sail sets it; 1337 is
            # the image's own user when it is unset.
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - mysql
    n8n:
        image: 'docker.n8n.io/n8nio/n8n:2.48.8'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_N8N_PORT:-5678}:5678'
        environment:
            GENERIC_TIMEZONE: 'Asia/Kuala_Lumpur'
            TZ: 'Asia/Kuala_Lumpur'
        volumes:
            - 'sail-n8n:/home/node/.n8n'
            - './resources/n8n:/workflows:ro'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-n8n:
        driver: local
